[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp"
version = "1.27.0+backport38"
description = "mcp 1.27.0 backported to Python 3.8/3.9 (vendored; server-side lowlevel + streamable HTTP verified)"
requires-python = ">=3.8"
# Upstream 1.27.0 Requires-Dist with three 3.8 relaxations:
#   pydantic >=2.11 -> >=2.10 (2.11 dropped py3.8; 2.10.6 resolves on 3.8)
#   pyjwt    >=2.10 -> >=2.9  (2.10 dropped py3.8)
#   typing-inspection gains a >=3.9 marker (no 3.8 distribution exists; only
#     FastMCP needs it, which this build guards out on 3.8)
# plus eval_type_backport on <3.10 — pydantic uses it to evaluate PEP 604/585
# string annotations (`str | int`, `list[int]`) on older interpreters.
dependencies = [
    "anyio>=4.5",
    "httpx-sse>=0.4",
    "httpx>=0.27.1",
    "jsonschema>=4.20.0",
    "pydantic-settings>=2.5.2",
    "pydantic>=2.10,<3.0.0",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "pywin32>=310; sys_platform == 'win32'",
    "sse-starlette>=1.6.1",
    "starlette>=0.27",
    "typing-extensions>=4.9.0",
    "typing-inspection>=0.4.1; python_version >= '3.9'",
    "uvicorn>=0.31.1; sys_platform != 'emscripten'",
    "eval_type_backport; python_version < '3.10'",
]

[tool.setuptools.packages.find]
include = ["mcp*"]
