name: ac-vlnverse
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.11

  # Deliberately the lightest env install in the repo: no torch, no simulator.
  # The env_vlnverse manager layer is pure python (kinematics, occupancy
  # collision, metrics, PNG encode); Isaac Sim 5.1 renders in its OWN bundled
  # python behind the msgpack RPC seam (_isaac_worker.py) and is a manual
  # prerequisite checked by install_ac_vlnverse.sh — never installed here.
  - numpy
  - pillow
  - requests
  - tqdm

  # msgpack RPC to the Isaac worker (length-prefixed frames + numpy arrays)
  - msgpack-python
  - msgpack-numpy

  - pip
  - pip:
      # auto_host server mode (python -m app.server.auto_host)
      - fastapi[standard]>=0.115.0
      - pydantic>=2.10.0
      - pydantic-settings>=2.6.0

      # scripts/data/fetch_scenes_vlnverse.py (HF scene downloader)
      - huggingface_hub
